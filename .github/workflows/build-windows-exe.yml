name: Build Windows executable

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable
        working-directory: backend
        run: pyinstaller desktop_app.spec --noconfirm

      - name: Upload build artifact (always, for debugging)
        uses: actions/upload-artifact@v4
        with:
          name: AnalyseGabaritChaussee-windows
          path: backend/dist/AnalyseGabaritChaussee.exe
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: backend/dist/AnalyseGabaritChaussee.exe
          generate_release_notes: true
