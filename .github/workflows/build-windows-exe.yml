name: Build Windows executable

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to create/publish (e.g. v0.1.0). Only used for manual runs — a tag push uses its own tag name."
        required: true
        default: "v0.1.0"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable
        working-directory: backend
        run: pyinstaller desktop_app.spec --noconfirm

      - name: Upload build artifact (always, for debugging)
        uses: actions/upload-artifact@v4
        with:
          name: AnalyseGabaritChaussee-windows
          path: backend/dist/AnalyseGabaritChaussee.exe
          if-no-files-found: error

      - name: Create/publish GitHub Release
        # On a tag push, softprops uses that tag automatically. On a manual
        # run there is no tag yet — passing tag_name here makes the action
        # create it (pointing at this run's commit) and publish the release
        # in the same step, no separate `git push --tags` needed.
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          files: backend/dist/AnalyseGabaritChaussee.exe
          generate_release_notes: true
